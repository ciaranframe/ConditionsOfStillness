# Conditions of Stillness — cue list. Spec §6. Ids mirror the PatchMarks letters by convention.
# A wrist not mentioned keeps its sound. Z / C assign a two-hand (2H) sound to a performer.
# Patches: COS_Precipice (the intro hum, locked 2026-09-29), COS_Precipice2 (the next stage, locked 2026-09-29).
piece: Conditions of Stillness
defaults: { fade: 2.0, level: 0 }        # level in dB
scenes:
  - id: A
    name: Standby, all silent
    sounds:
      ZL: silence
      ZR: silence
      CL: silence
      CR: silence
  - id: B
    name: Precipice — right hands
    sounds:
      ZR: COS_Precipice
      CR: COS_Precipice
      ZL: silence
      CL: silence
  - id: C
    name: Precipice 2 — right hands
    fade: 0.5
    sounds:
      ZR: COS_Precipice2
      CR: COS_Precipice2
