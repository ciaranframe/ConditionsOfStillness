<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Perform — Zubin's page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#000000;color:#ffffff}
a{color:#ffffff}a:hover{color:#ffffff}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #000000; color: #ffffff; display: flex; flex-direction: column; padding: 24px; gap: 20px">

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; height: 84px">
    <sc-for list="{{status}}" as="st" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 10px 14px; border-radius: 6px; background: {{st.bg}}; color: {{st.fg}}; border: 2px solid {{st.border}}">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.12em; opacity: 0.85">{{st.label}}</div>
        <div style="font-size: 26px; font-weight: 700; line-height: 1">{{st.value}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 20px; height: 380px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 16px 32px; border-radius: 6px; background: #0e0e0e; border: 2px solid #3a3a3a">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; letter-spacing: 0.14em; color: #b8b8b8">SCENE</div>
      <div style="display: flex; align-items: baseline; gap: 40px">
        <div style="font-size: 300px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: #ffffff">{{scene.id}}</div>
        <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <div style="font-size: 64px; font-weight: 600; line-height: 1.05; color: #ffffff">{{scene.name}}</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: #b8b8b8">{{scene.n}} of {{sceneCount}} · fade {{scene.fade}} s</div>
        </div>
      </div>
    </div>
    <div style="width: 400px; display: flex; flex-direction: column; gap: 20px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 16px 24px; border-radius: 6px; background: #0e0e0e; border: 2px solid #3a3a3a">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.14em; color: #b8b8b8">NEXT</div>
        <div style="display: flex; align-items: baseline; gap: 20px">
          <div style="font-size: 110px; font-weight: 700; line-height: 1; color: #ffffff">{{next.id}}</div>
          <div style="font-size: 30px; font-weight: 500; color: #ffffff">{{next.name}}</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 24px; border-radius: 6px; background: #0e0e0e; border: 2px solid #2a2a2a">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; letter-spacing: 0.14em; color: #8a8a8a">PREVIOUS</div>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="font-size: 48px; font-weight: 700; line-height: 1; color: #b8b8b8">{{prev.id}}</div>
          <div style="font-size: 22px; color: #b8b8b8">{{prev.name}}</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; height: 190px">
    <sc-for list="{{sticks}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 6px; background: #0e0e0e; border: 2px solid {{s.border}}; min-width: 0">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 600; color: #ffffff">{{s.name}}</div>
          <div style="font-size: 16px; color: #b8b8b8">{{s.who}}</div>
        </div>
        <div style="font-size: 26px; font-weight: 500; color: {{s.patchColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.patch}}</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
          <div style="padding: 6px 12px; border-radius: 4px; background: {{s.stateBg}}; color: {{s.stateFg}}; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">{{s.state}}</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: {{s.battColor}}">{{s.batt}}</div>
        </div>
        <sc-if value="{{s.fading}}" hint-placeholder-val="{{ false }}">
          <div style="height: 8px; border-radius: 2px; background: #2a2a2a; overflow: hidden">
            <div style="height: 8px; background: #f0b429; width: {{s.barWidth}}"></div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 20px; margin-top: auto; height: 120px">
    <button onClick="{{back}}" aria-label="Back one scene" style="width: 360px; height: 120px; border-radius: 6px; border: 3px solid #5a5a5a; background: #1a1a1a; color: #ffffff; font-size: 34px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 16px; cursor: pointer">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      <span>BACK TO {{prev.id}}</span>
    </button>
    <button onClick="{{advance}}" aria-label="Go to next scene" style="flex-grow: 1; height: 120px; border-radius: 6px; border: 3px solid #ffffff; background: #ffffff; color: #000000; font-size: 44px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 24px; cursor: pointer">
      <span>NEXT: SCENE {{next.id}}</span>
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showTransition":{"editor":"boolean","default":true},"simulateFault":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 3 };
  }
  scenes() {
    return [
      { id: 'A', name: 'Opening stillness', fade: '6.0', p: ['COS_Breath', 'COS_Breath', 'silence', 'COS_Skin'] },
      { id: 'B', name: 'First strike', fade: '0.1', p: ['COS_Breath', 'COS_Breath', 'COS_Membrane2H', 'COS_Membrane2H'] },
      { id: 'C', name: 'Held breath', fade: '4.0', p: ['COS_Breath', 'COS_Breath', 'COS_Membrane2H', 'COS_Membrane2H'] },
      { id: 'D', name: 'Glass', fade: '6.0', p: ['COS_Glass', 'COS_Glass', 'silence', 'COS_Skin'] },
      { id: 'E', name: 'Undertow', fade: '2.0', p: ['COS_Undertow2H', 'COS_Undertow2H', 'COS_Skin', 'COS_Skin'] },
      { id: 'F', name: 'Skin and bone', fade: '0.5', p: ['COS_Glass', 'silence', 'COS_Bone', 'COS_Bone'] },
      { id: 'G', name: 'Stillness II', fade: '10.0', p: ['COS_Breath', 'COS_Breath', 'silence', 'silence'] }
    ];
  }
  renderVals() {
    const GREEN = '#2fbf6b', AMBER = '#f0b429', RED = '#e5484d', GREY = '#3a3a3a';
    const showTransition = this.props.showTransition ?? true;
    const fault = this.props.simulateFault ?? false;
    const scenes = this.scenes();
    const idx = this.state.idx;
    const scene = scenes[idx];
    const next = scenes[Math.min(idx + 1, scenes.length - 1)];
    const prev = scenes[Math.max(idx - 1, 0)];
    const ok = (label, value) => ({ label, value, bg: GREEN, fg: '#000000', border: GREEN });
    const bad = (label, value) => ({ label, value, bg: RED, fg: '#000000', border: RED });
    const warn = (label, value) => ({ label, value, bg: AMBER, fg: '#000000', border: AMBER });
    const status = [
      ok('PEDAL', 'OK'),
      fault ? bad('STICKS', '3 / 4') : ok('STICKS', '4 / 4'),
      ok('AIRKIT', 'OK'),
      ok('AUDIO', 'OK'),
      fault ? warn('BATTERY', 'B1 LOW') : ok('BATTERY', 'OK'),
      { label: 'CLOCK', value: '20:41:07', bg: '#0e0e0e', fg: '#ffffff', border: '#3a3a3a' }
    ];
    const meta = [
      ['A3', 'Zubin · left'], ['A4', 'Zubin · right'], ['B1', 'Claire · left'], ['B2', 'Claire · right']
    ];
    const batts = ['81%', '79%', fault ? '14%' : '62%', '88%'];
    const sticks = meta.map((m, i) => {
      const patch = scene.p[i];
      const silent = patch === 'silence';
      const fading = showTransition && idx === 3 && i === 1;
      const nosig = fault && i === 2;
      let state = 'OK', stateBg = GREEN, border = GREY;
      if (silent) { state = 'SILENT'; stateBg = '#5a5a5a'; }
      if (fading) { state = 'FADING 62%'; stateBg = AMBER; border = AMBER; }
      if (nosig) { state = 'NO SIGNAL'; stateBg = RED; border = RED; }
      return {
        name: m[0], who: m[1],
        patch: fading ? prev.p[i] + ' → ' + patch : patch,
        patchColor: silent ? '#8a8a8a' : '#ffffff',
        state, stateBg, stateFg: '#000000', border,
        batt: batts[i], battColor: (fault && i === 2) ? AMBER : '#b8b8b8',
        fading, barWidth: '62%'
      };
    });
    return {
      status, sticks,
      sceneCount: scenes.length,
      scene: { id: scene.id, name: scene.name, fade: scene.fade, n: idx + 1 },
      next: { id: next.id, name: next.name },
      prev: { id: prev.id, name: prev.name },
      advance: () => this.setState({ idx: Math.min(idx + 1, scenes.length - 1) }),
      back: () => this.setState({ idx: Math.max(idx - 1, 0) })
    };
  }
}
</script>
</body>
</html>
